name: PR2235 focused Windows qualification
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed candidate SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  skill-source-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ouroboros-agent/ouroboros
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact tested source
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw 'Candidate mismatch' }
          git rev-parse HEAD 'HEAD^{tree}'
          git --version
          Get-FileHash ouroboros/skill_source_git.py, tests/test_skill_source_git.py -Algorithm SHA256
      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - name: Run real Git and installer regressions
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & $python -I -S scripts/safe_test.py --temp-parent "$env:RUNNER_TEMP" --evidence-dir "$env:RUNNER_TEMP/pr2235-evidence" --timeout 900 -- $python -m pytest tests/test_skill_source_git.py tests/test_skill_source_views.py tests/test_skill_source_documentation.py tests/test_skill_source_lifecycle.py -vv --tb=short
          exit $LASTEXITCODE
      - name: Retain full evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2235-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/pr2235-evidence/
          if-no-files-found: error
          retention-days: 14
