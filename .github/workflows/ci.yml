# Experiment-only branch. Never merge this workflow into a product branch.
# Manual, secret-free native feasibility probe; not product or release qualification.
name: Windows 1297 feasibility experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    if: github.ref == 'refs/heads/probe/windows-confinement-1aff'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .platform-probe
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Native primitive probe; skips remain incomplete
        shell: pwsh
        run: |
          & ./.platform-probe/rerun-disposable-windows.ps1 -AcknowledgeDisposableRunner -StopServerForSinks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-1297-feasibility
          path: ${{ env.probe1297_evidence }}
          if-no-files-found: error
          retention-days: 14
