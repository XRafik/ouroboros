# TEMPORARY one-shot qualification. Parent copies it to .github/workflows/ on
# the dedicated probe branch only; never merge it or use it as release CI.
name: Windows 2022 private CLI qualification 1677
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: github.ref == 'refs/heads/probe/windows-cli-1677-1aff'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: false
      - name: Source-bound private engine and real vendor Update
        id: probe
        timeout-minutes: 29
        shell: pwsh
        run: |
          & ./.platform-qa/1677/run_windows.ps1 -SourceRoot $PWD.Path -Python (Get-Command python.exe).Source -Uv (Get-Command uv.exe).Source -EngineVersion "4.5.0" -EngineBuild "2b2dfc15e23e5c9ee625aec8d4bd10fde56aa7b8"
          exit $LASTEXITCODE
      - name: Upload only explicit non-secret diagnostics, including on failure
        if: always() && steps.probe.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-1677-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.evidence }}/runner.json
            ${{ steps.probe.outputs.evidence }}/controller.json
            ${{ steps.probe.outputs.evidence }}/probe/receipt.json
          if-no-files-found: error
          retention-days: 7
