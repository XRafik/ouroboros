# Experiment-only branch. NEVER merge this workflow into a product branch.
# Native passive metadata observer; no services/drivers are stopped in this run.
name: Windows 1297 feasibility experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    if: github.ref == 'refs/heads/probe/windows-confinement-1aff'
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .platform-probe
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Calibrated UNC metadata observation; incomplete stays red
        shell: pwsh
        timeout-minutes: 5
        run: |
          & ./.platform-probe/unc-etw/run_windows.ps1 -Candidate ./.platform-probe/windows_relative_probe.py -RunDirectory "$env:RUNNER_TEMP/unc1297-etw-r1"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-1297-unc-etw
          path: |
            ${{ runner.temp }}/unc1297-etw-r1/build.log
            ${{ runner.temp }}/unc1297-etw-r1/run.jsonl
            ${{ runner.temp }}/unc1297-etw-r1/run.stderr.log
            ${{ runner.temp }}/unc1297-etw-r1/evidence/*.jsonl
          if-no-files-found: error
          retention-days: 14
