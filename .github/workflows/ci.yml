name: Linux AppImage retained-artifact native check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.ref == 'refs/heads/probe/linux-native-ready-1aff'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a736ceb6e748f83ce2cc09d79203a6023adaf7d2
          persist-credentials: false
          fetch-depth: 2
      - name: Retrieve and verify the already-built diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a736ceb6e748f83ce2cc09d79203a6023adaf7d2
          mkdir -p "$RUNNER_TEMP/ob688-evidence"
          gh api repos/razzant/ouroboros/actions/artifacts/12389322932/zip > "$RUNNER_TEMP/input.zip"
          echo "e9a493497c95519875cbc06c1ab88881075874f69eb16f52c27c0081d7ade9fb  $RUNNER_TEMP/input.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/input.zip" "$RUNNER_TEMP/ob688-evidence" <<'PY'
          import hashlib, json, pathlib, shutil, sys, zipfile
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          selected = {}
          with zipfile.ZipFile(archive) as z:
              (out / 'input-members.json').write_text(json.dumps(z.namelist(), indent=2))
              for info in z.infolist():
                  member = pathlib.PurePosixPath(info.filename)
                  if len(member.parts) != 1 or info.is_dir():
                      continue
                  name = member.name
                  if name.endswith('.AppImage') or name in ('appimage.sha256', 'gtk-manifest.json', 'repo_bundle_manifest.json', 'source-sha.txt', 'source-tree.txt', 'focused-tests.xml'):
                      assert name not in selected, name
                      with z.open(info) as src, (out / name).open('wb') as dst:
                          shutil.copyfileobj(src, dst)
                      selected[name] = info.filename
          apps = list(out.glob('*.AppImage'))
          assert len(apps) == 1
          expected = (out / 'appimage.sha256').read_text().split()[0]
          digest = hashlib.sha256()
          with apps[0].open('rb') as f:
              for block in iter(lambda: f.read(1024 * 1024), b''):
                  digest.update(block)
          assert digest.hexdigest() == expected
          assert (out / 'source-sha.txt').read_text().strip() == 'a736ceb6e748f83ce2cc09d79203a6023adaf7d2'
          apps[0].chmod(0o755)
          (out / 'retained-artifact.json').write_text(json.dumps({'source_run':39691400406,'source_sha':'a736ceb6e748f83ce2cc09d79203a6023adaf7d2','artifact_id':12389322932,'archive_sha256':'e9a493497c95519875cbc06c1ab88881075874f69eb16f52c27c0081d7ade9fb','appimage_sha256':expected,'selected_members':selected,'prior_native':'not run: runner permission failure before container start'}, indent=2))
          PY
      - name: Apply the retained native-reader correction only
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for path in scripts/x11_window_identity.py scripts/qualify_linux_appimage.py tests/test_x11_window_identity.py; do
            git show "$GITHUB_SHA:$path" > "$path"
          done
          git diff --binary > "$RUNNER_TEMP/ob688-evidence/qualifier-correction.patch"
          sha256sum scripts/x11_window_identity.py scripts/qualify_linux_appimage.py tests/test_x11_window_identity.py > "$RUNNER_TEMP/ob688-evidence/qualifier-correction.sha256"
      - name: Build the clean desktop without GTK or WebKit
        run: |
          set -euo pipefail
          docker build --progress=plain --target desktop -f packaging/appimage/native-qualification.Dockerfile -t ob688-desktop . 2>&1 | tee "$RUNNER_TEMP/ob688-evidence/docker-desktop.log"
          docker image inspect ob688-desktop > "$RUNNER_TEMP/ob688-evidence/desktop-image.json"
      - name: Exercise the same AppImage without network or host GUI libraries
        timeout-minutes: 18
        run: |
          set -euo pipefail
          chmod -R a+rwX "$RUNNER_TEMP/ob688-evidence"
          docker run --name ob688-desktop-run --rm --network none --shm-size=1g \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP/ob688-evidence:/evidence" \
            -w /source ob688-desktop bash -c 'set -euo pipefail
              mkdir -p /tmp/ob688-native
              cp -R /source/. /tmp/ob688-source
              cd /tmp/ob688-source
              python3 -I -S scripts/safe_test.py --temp-parent /tmp/ob688-native \
                --evidence-dir /evidence/native-safe-test --timeout 900 -- \
                dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" bash -c '\''
                  openbox > /evidence/openbox.log 2>&1 &
                  python3 -I -S scripts/qualify_linux_appimage.py /evidence/*.AppImage /evidence/native
                '\''' 2>&1 | tee "$RUNNER_TEMP/ob688-evidence/native.log"
      - name: Recover diagnostics without copying the AppImage again
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/ob688-evidence"; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ob688-evidence"
            chmod -R u+rwX "$RUNNER_TEMP/ob688-evidence"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue688-retained-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ob688-evidence/*.json
            ${{ runner.temp }}/ob688-evidence/*.log
            ${{ runner.temp }}/ob688-evidence/*.patch
            ${{ runner.temp }}/ob688-evidence/*.sha256
            ${{ runner.temp }}/ob688-evidence/native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
