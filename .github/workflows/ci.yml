name: Windows artifact HTTP qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-artifact-http:
    if: github.ref == 'refs/heads/probe/windows-artifact-http-1aff'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.1'
          enable-cache: false
      - name: Prepare dependency-only environment
        shell: pwsh
        run: |
          uv sync --locked --python 3.11 --group dev --no-install-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real Windows HTTP and storage consumers
        shell: pwsh
        run: .\.platform-qa\run_windows.ps1
      - name: Retain exact primary evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact-http
          path: ${{ runner.temp }}/artifact-http-evidence
          if-no-files-found: error
          retention-days: 7
